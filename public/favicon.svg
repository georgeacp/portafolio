<svg xmlns="http://www.w3.org/2000/svg" viewBox="175 163 674 690" fill="none">
  <style>
    :root {
      --logo-body-deep: #111726;
      --logo-body-mid: #1B2436;
      --logo-body-soft: #263248;
      --logo-gold-peak: #FBE3B5;
      --logo-gold-warm: #D8AF72;
      --logo-gold-bronze: #9A7644;
      --logo-crease-shadow: #090D16;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --logo-body-deep: #F8FAFC;
        --logo-body-mid: #E2E8F0;
        --logo-body-soft: #CBD5E1;
        --logo-gold-peak: #FEF08A;
        --logo-gold-warm: #F59E0B;
        --logo-gold-bronze: #D97706;
        --logo-crease-shadow: #64748B;
      }
    }
  </style>

  <defs>
    <!-- Upper C ribbon gradient: body -> warm bronze -> champagne gold peak on top-right -->
    <linearGradient id="gc-upper-c" x1="220" y1="540" x2="765" y2="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--logo-body-deep)" />
      <stop offset="48%" stop-color="var(--logo-body-mid)" />
      <stop offset="74%" stop-color="var(--logo-gold-bronze)" />
      <stop offset="90%" stop-color="var(--logo-gold-warm)" />
      <stop offset="100%" stop-color="var(--logo-gold-peak)" />
    </linearGradient>

    <!-- Lower C ribbon gradient -->
    <linearGradient id="gc-lower-c" x1="250" y1="360" x2="740" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--logo-body-soft)" />
      <stop offset="35%" stop-color="var(--logo-body-mid)" />
      <stop offset="100%" stop-color="var(--logo-body-deep)" />
    </linearGradient>

    <!-- Inner left 3D ribbon fold highlight -->
    <linearGradient id="gc-fold-sheen" x1="362" y1="342" x2="275" y2="535" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--logo-gold-peak)" />
      <stop offset="42%" stop-color="var(--logo-gold-warm)" />
      <stop offset="78%" stop-color="var(--logo-body-mid)" />
      <stop offset="100%" stop-color="var(--logo-body-deep)" stop-opacity="0" />
    </linearGradient>

    <!-- Inner G metallic body gradient -->
    <linearGradient id="gc-inner-g" x1="335" y1="330" x2="705" y2="695" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="var(--logo-body-mid)" />
      <stop offset="55%" stop-color="var(--logo-body-deep)" />
      <stop offset="100%" stop-color="var(--logo-body-soft)" />
    </linearGradient>
  </defs>

  <!-- 1. Lower C Ribbon (Tucked under the left 3D fold, sweeping around bottom to bottom-right) -->
  <path
    d="M 362 342 A 229 229 0 1 0 711 634 L 781 685 A 315 315 0 0 1 216 590 C 234 495 288 402 362 342 Z"
    fill="url(#gc-lower-c)"
  />

  <!-- 2. Champagne-Gold Inner Fold Reflection along the left ribbon tuck -->
  <path
    d="M 362 342 A 229 229 0 0 0 292 532 C 276 472 308 396 362 342 Z"
    fill="url(#gc-fold-sheen)"
  />

  <!-- 3. Subtle crease shadow line for 3D depth -->
  <path
    d="M 216 590 C 234 495 288 402 362 342"
    stroke="var(--logo-crease-shadow)"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.45"
  />

  <!-- 4. Upper C Ribbon (Sweeping from left outer crease around top to Champagne-Gold top-right terminal) -->
  <path
    d="M 216 590 A 315 315 0 0 1 777 326 L 706 390 A 229 229 0 0 0 362 342 C 288 402 234 495 216 590 Z"
    fill="url(#gc-upper-c)"
  />

  <!-- 5. Inner G - Main C-curve with bottom diagonal slash -->
  <path
    d="M 685 418 L 608 436 A 114 114 0 1 0 564 613 L 516 696 A 188 188 0 1 1 685 418 Z"
    fill="url(#gc-inner-g)"
  />

  <!-- 6. Inner G - Horizontal crossbar & sharp diagonal right jaw -->
  <path
    d="M 514 490 L 712 490 A 192 192 0 0 1 543 695 L 634 556 L 514 556 Z"
    fill="url(#gc-inner-g)"
  />
</svg>
